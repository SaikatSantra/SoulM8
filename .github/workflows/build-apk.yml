name: Build & Release Soulm8 Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: 'stable'

      - name: Install Dependencies
        run: |
          cd mobile
          flutter pub get

      - name: Build Android Release APK
        run: |
          cd mobile
          flutter build apk --release --dart-define=BACKEND_HOST=soulm8-iota.vercel.app

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: soulm8-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk

      - name: Publish Direct Public Download Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Soulm8 Android Release v1.0.0"
          body: "Official Soulm8 Android APK install file. Direct download for Android phones."
          files: mobile/build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
