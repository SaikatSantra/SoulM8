name: Build & Release Soulm8 Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: 'stable'

      - name: Install Dependencies
        run: |
          cd mobile
          flutter pub get

      - name: Generate Release Signing Keystore
        run: |
          keytool -genkeypair -v -keystore mobile/android/app/upload-keystore.jks \
            -alias soulm8 -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass soulm8password -keypass soulm8password \
            -dname "CN=Soulm8, OU=Mobile, O=Soulm8, L=Kolkata, ST=WB, C=IN"

      - name: Build Android Release APK
        run: |
          cd mobile
          flutter build apk --release --dart-define=BACKEND_HOST=soulm8-iota.vercel.app

      - name: Verify APK Signature
        run: |
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --verbose mobile/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: soulm8-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk

      - name: Publish Direct Public Download Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Soulm8 Android Release v1.0.0"
          body: "Official signed Soulm8 Android APK install file. Direct download for Android phones."
          files: mobile/build/app/outputs/flutter-apk/app-release.apk
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
